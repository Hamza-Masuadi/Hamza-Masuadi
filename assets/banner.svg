<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <!-- background blobs -->
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- shimmering name gradient -->
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox" spreadMethod="repeat">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.35" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#7dd3fc"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.07"/>
    </pattern>

    <!-- typing clips: monospace text forced to exact widths with textLength -->
    <clipPath id="c1"><rect x="96" y="232" height="40" width="0">
      <animate attributeName="width" values="0;264;264;0;0" keyTimes="0;0.1;0.27;0.32;1" dur="12s" begin="0s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c2"><rect x="96" y="232" height="40" width="0">
      <animate attributeName="width" values="0;436;436;0;0" keyTimes="0;0.1;0.27;0.32;1" dur="12s" begin="4s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c3"><rect x="96" y="232" height="40" width="0">
      <animate attributeName="width" values="0;488;488;0;0" keyTimes="0;0.1;0.27;0.32;1" dur="12s" begin="8s" repeatCount="indefinite"/>
    </rect></clipPath>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .spin  { transform-origin: 940px 180px; animation: spin 24s linear infinite; }
      .spinR { transform-origin: 940px 180px; animation: spin 36s linear infinite reverse; }
      .spinF { transform-origin: 940px 180px; animation: spin 14s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .pulse { transform-origin: 940px 180px; animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.12); opacity: 1; } }
      .ring { fill: none; stroke: #ffffff; stroke-opacity: .12; }
    </style>
  </defs>

  <!-- base -->
  <rect width="1200" height="360" rx="18" fill="#0b0f19"/>
  <g filter="url(#blur)" opacity="0.55">
    <circle cx="250" cy="80" r="160" fill="#6d28d9">
      <animateTransform attributeName="transform" type="translate" values="0 0;120 60;0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="300" r="180" fill="#0369a1">
      <animateTransform attributeName="transform" type="translate" values="0 0;-140 -50;0 0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="360" r="120" fill="#be185d" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;80 -90;0 0" dur="16s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect width="1200" height="360" rx="18" fill="url(#dots)"/>

  <!-- left: text -->
  <g>
    <text x="72" y="110" class="mono" font-size="18" fill="#64748b">~/hamza <tspan fill="#a78bfa">$</tspan> whoami</text>
  </g>
  <g>
    <text x="68" y="190" class="sans" font-size="76" font-weight="800" letter-spacing="-2" fill="url(#nameGrad)">Hamza Masuadi</text>
  </g>
  <g>
    <text x="72" y="258" class="mono" font-size="22" fill="#22d3ee">&gt;</text>
    <!-- role 1: 20 chars -->
    <g clip-path="url(#c1)">
      <text x="96" y="258" class="mono" font-size="22" fill="#e2e8f0" textLength="264" lengthAdjust="spacingAndGlyphs">full-stack developer</text>
    </g>
    <g class="blink"><rect x="96" y="238" width="11" height="26" fill="#22d3ee">
      <animate attributeName="x" values="96;360;360;96;96" keyTimes="0;0.1;0.27;0.32;1" dur="12s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.32;0.33;1" dur="12s" begin="0s" repeatCount="indefinite"/>
    </rect></g>
    <!-- role 2: 33 chars -->
    <g clip-path="url(#c2)">
      <text x="96" y="258" class="mono" font-size="22" fill="#e2e8f0" textLength="436" lengthAdjust="spacingAndGlyphs">flutter · next.js · node · prisma</text>
    </g>
    <g class="blink"><rect x="96" y="238" width="11" height="26" fill="#22d3ee" opacity="0">
      <animate attributeName="x" values="96;532;532;96;96" keyTimes="0;0.1;0.27;0.32;1" dur="12s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.32;0.33;1" dur="12s" begin="4s" repeatCount="indefinite"/>
    </rect></g>
    <!-- role 3: 35 chars -->
    <g clip-path="url(#c3)">
      <text x="96" y="258" class="mono" font-size="22" fill="#e2e8f0" textLength="488" lengthAdjust="spacingAndGlyphs">shipping web &amp; mobile apps end to end</text>
    </g>
    <g class="blink"><rect x="96" y="238" width="11" height="26" fill="#22d3ee" opacity="0">
      <animate attributeName="x" values="96;584;584;96;96" keyTimes="0;0.1;0.27;0.32;1" dur="12s" begin="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.32;0.33;1" dur="12s" begin="8s" repeatCount="indefinite"/>
    </rect></g>
    <text x="72" y="300" class="mono" font-size="14" fill="#475569">// web · mobile · backend · ai tooling</text>
  </g>

  <!-- right: orbit system -->
  <g>
    <circle cx="940" cy="180" r="130" class="ring" stroke-dasharray="2 8"/>
    <circle cx="940" cy="180" r="92" class="ring"/>
    <circle cx="940" cy="180" r="54" class="ring" stroke-dasharray="4 6"/>

    <g class="spinR">
      <circle cx="1070" cy="180" r="7" fill="#f472b6" filter="url(#glow)"/>
      <circle cx="810" cy="180" r="4" fill="#fbcfe8"/>
      <circle cx="940" cy="50" r="3" fill="#fbcfe8" opacity=".7"/>
    </g>
    <g class="spin">
      <circle cx="1032" cy="180" r="9" fill="#a78bfa" filter="url(#glow)"/>
      <circle cx="894" cy="100" r="5" fill="#c4b5fd"/>
      <circle cx="894" cy="260" r="4" fill="#c4b5fd" opacity=".7"/>
    </g>
    <g class="spinF">
      <circle cx="994" cy="180" r="6" fill="#22d3ee" filter="url(#glow)"/>
      <circle cx="886" cy="180" r="3" fill="#a5f3fc"/>
    </g>

    <g class="pulse">
      <circle cx="940" cy="180" r="26" fill="#22d3ee" opacity="0.15"/>
      <circle cx="940" cy="180" r="16" fill="#0b0f19" stroke="#22d3ee" stroke-width="2" filter="url(#glow)"/>
      <text x="940" y="186" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#22d3ee">&lt;/&gt;</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="359" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
